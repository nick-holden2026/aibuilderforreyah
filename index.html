<div class="wrap"><div class="top"><b>🤖 Bolt’s Repair Quest</b><span><span class="chip" id="st"></span> <button class="alt" id="mu" onclick="S.mute=!S.mute;save();hdr()" aria-label="Sound on or off"></button></span></div><main id="main" style="padding-bottom:90px"></main></div>

<div id="wl"><div><div style="font-size:4rem">🤖💥</div><h1 id="wh">Hi Reyah!</h1><p>Bolt the robot lost his parts in a storm! Will you help rebuild him? Pick your buddy.</p><button onclick="init('dog')">🐶 Bruno</button><button onclick="init('cat')">🐱 Misty</button></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[ri(0,a.length-1)],shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),sum=a=>a.reduce((x,y)=>x+y,0);
let S={name:"Reyah",pet:"dog",w:{},st:{},boss:0,mute:false,coins:0,hats:[],hat:"",hue:0,hues:[0]};let CK={t:null};try{Object.assign(S,JSON.parse(localStorage.getItem("aa2g")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("aa2g",JSON.stringify(S))}catch(e){}};
const MS=[
{e:"🦾",p:"arm",t:"Code Bolt’s Arm",c:"#ff8a3d",s:"Bolt’s arm is stuck! Give it step-by-step commands so it can grab the battery. Giving steps to a computer is called coding.",h:"Count the squares to the battery. Use ⬆️×3 to move 3 squares, then turn with ↪️ or ↩️."},
{e:"👀",p:"eyes",t:"Data Detective",c:"#35a7ff",s:"Someone ate Bolt’s cookies! Read the bar chart to solve the mystery.",h:"The tallest bar is the biggest. Total means add all the bars. Average means total divided by 5."},
{e:"🧠",p:"brain",t:"Teach Bolt’s Eyes",c:"#a45cf0",s:"Bolt can’t tell 🔴 from 🔵. Teach him with examples. This is real machine learning!",h:"Tap the box to add dots. Put reds on one side and blues on the other. Press ✨ for quick examples."},
{e:"❤️",p:"heart",t:"Mood Machine",c:"#ff5fa2",s:"Bolt wants to understand feelings. Teach him which sentences are happy and which are sad!",h:"Tap 😊 for happy sentences and 😢 for sad ones. Bolt learns from YOUR labels, so be careful!"},
{e:"🗣️",p:"voice",t:"Wish Machine",c:"#2a8f8f",s:"A genie gives wishes, but only if you ask well! Build a great wish. Good AI prompts work the same way.",h:"A great wish has a role, a clear task, a format and limits. Pick the clearest choice for each."},
{e:"⚖️",p:"scales",t:"Fair Play Referee",c:"#e8903a",s:"Bolt’s referee picks players for two teams, but it is unfair! Can you make it fair for both teams?",h:"First slide to 5% to see the gap. Then switch on ‘tell the robot the team’ and watch both bars."},
{e:"💬",p:"chat chip",t:"Chat with Bolt",c:"#16b97d",s:"Teach Bolt to chat. He matches your words to what he knows, and says ‘not sure’ when he does not know.",h:"Ask something close to your phrases, like ‘hello bolt’. Then ask something silly to see ‘not sure’."},
{e:"⚡",p:"power core",t:"Power Core",c:"#d6277a",s:"The last part! Give Bolt a super-power that helps real people, and make it safe.",h:"Pick a problem and a power, then tick all three safety checks."}];
let AC;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
function snd(t){if(S.mute||!AC)return;try{AC.resume();({ok:[523,659,784],bad:[250,190],up:[523,659,784,1047,1319],tap:[620]}[t]||[500]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t=="bad"?"sawtooth":"triangle";o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+i*.11;o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+.2);o.stop(s+.22)})}catch(e){}}
let LAST="";function say(t){LAST=t;const b=$("#bub");if(b)b.textContent=t;if(S.mute||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=S.pet=="cat"?1.8:.6;u.lang="en-US";speechSynthesis.speak(u)}catch(e){}}
function confetti(){["🎉","⭐","✨","🎈"].forEach(c=>{for(let i=0;i<4;i++){const d=document.createElement("div");d.className="cf";d.textContent=c;d.style.left=Math.random()*95+"vw";d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}})}
const PE=()=>S.pet=="cat"?"🐱":"🐶",PN=()=>S.pet=="cat"?"Misty":"Bruno",SD=()=>S.pet=="cat"?"Meow meow!":"Woof woof!";
const buddy=()=>`<div class="bd"><div class="bud" onclick="say(LAST)" role="button" aria-label="Hear again">${PE()}</div><div class="bub" id="bub" aria-live="polite"></div></div>`;
const nd=()=>MS.filter((_,i)=>S.w[i]).length,stars=()=>sum(Object.values(S.st));
let V="map",C=0,mis=0;
function hdr(){$("#st").textContent="⭐ "+stars()+" · 🪙 "+S.coins;$("#mu").textContent=S.mute?"🔇":"🔊";$("#tabs").innerHTML=[["map","🗺️ Quest"],["shop","🛍️ Workshop"],["tro","🏆 Trophies"]].map(t=>`<button class="${V==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}
function show(h,t){clearInterval(CK.t);CK.t=null;$("#main").innerHTML=h;hdr();window.scrollTo(0,0);if(t)say(t)}
function go(v){V=v;snd("tap");({map,shop,tro})[v]()}
function init(p){S.pet=p;save();$("#wl").style.display="none";snd("up");V="map";map(SD()+" Hi "+S.name+"! Bolt lost his parts in a storm. Let’s rebuild him together! Tap the glowing level.")}
const boltRow=()=>`<div class="bolt" aria-label="Bolt's parts">${MS.map((m,i)=>`<span class="${S.w[i]?"":"no"}">${S.w[i]?m.e:"❓"}</span>`).join("")}</div>`;
function map(t){let h=buddy()+boltBig()+boltRow();MS.forEach((m,i)=>{const op=i==0||S.w[i-1],cur=op&&!S.w[i];h+=`<button class="nd ${S.w[i]?"dn":op?"":"lk"} ${cur?"cur":""}" style="--c:${m.c};margin-left:${[0,35,60,35,0,35,60,35][i]}px" ${op?`onclick="start(${i})"`:"disabled"}><b>${op?m.e:"🔒"}</b><span>${m.t}<small>${S.w[i]?"✅ "+"⭐".repeat(S.st[i]||1)+" Play again":cur?"▶ Tap to play":op?"Play":"Fix the part before"}</small></span></button>`});
const ex=nd()==8;h+=`<button class="nd ${S.boss?"dn":ex?"cur":"lk"}" style="--c:#222;margin-left:35px" ${ex?`onclick="boss()"`:"disabled"}><b>${ex?"👾":"🔒"}</b><span>Glitch Monster Battle<small>${S.boss?"✅ Defeated!":ex?"▶ Final boss":"Fix all 8 parts first"}</small></span></button>`;
show(h,typeof t=="string"?t:"Pick a part to fix, "+S.name+"!")}
function start(i){C=i;mis=0;const m=MS[i];show(buddy()+`<div class="card" style="text-align:center"><div class="big">${m.e}</div><h2 style="margin:0">${m.t}</h2><p>${E(m.s)}</p></div><button class="go" onclick="play()">Let’s play! ➜</button><button class="alt" onclick="go('map')">⬅ Back</button>`,m.s)}
function play(){mis=0;show(buddy()+`<div id="g"></div><div id="aid" style="margin-top:10px"><button class="alt" onclick="hint()">💡 Hint</button></div>`,MS[C].t+"! You can do it.");GAMES[C]()}
function hint(){say(MS[C].h)}
function bad(){mis++;snd("bad");if(mis>=5&&!$("#skip"))$("#aid").insertAdjacentHTML("beforeend",`<button class="alt" id="skip" onclick="win(1)">⏭️ Skip for now</button>`)}
const boltBig=()=>`<div class="bb" aria-label="Bolt the robot"><span class="hat">${S.hat||""}</span><span style="filter:hue-rotate(${S.hue}deg);display:inline-block">🤖</span></div>`;
function pop(t){const d=document.createElement("div");d.textContent=t;d.className="pp";document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function addCoins(n){if(n<=0)return;S.coins+=n;save();hdr();pop("+"+n+" 🪙")}
function win(forced){const k=forced?1:mis<=1?3:mis<=3?2:1,m=MS[C],ch=ri(5,25),gain=10*k+ch;S.w[C]=1;S.st[C]=Math.max(S.st[C]||0,k);S.coins+=gain;save();snd("up");confetti();show(buddy()+`<div class="card" style="text-align:center"><div class="big dance">${m.e}</div><h2 style="margin:0">Bolt got his ${m.p}!</h2><p style="font-size:2rem">${"⭐".repeat(k)}${"☆".repeat(3-k)}</p><p>🪙 ${10*k} for stars + ${ch} from the 🎁 lucky chest = <b>+${gain} coins!</b></p></div>${boltBig()}${boltRow()}<button class="go" onclick="go('map')">Next ➜</button><button class="alt" onclick="go('shop')">🛍️ Spend coins on Bolt</button>`,"Hooray, "+S.name+"! Bolt got his "+m.p+"! You won "+gain+" coins!")}
const HATS=[["🎩",20],["👑",50],["🧢",15],["🎓",30],["🎀",15],["⛑️",25]],HUES=[[0,"Classic",0],[60,"Sunny",10],[120,"Mint",10],[200,"Ocean",10],[280,"Grape",10],[330,"Berry",10]];
function shop(){show(buddy()+boltBig()+`<div class="card"><h3>🎩 Hats</h3><div class="g">${HATS.map(([e,c])=>`<button class="t ${S.hat==e?"on":""}" onclick="hat('${e}',${c})"><span>${e}</span>${S.hat==e?"Wearing":S.hats.includes(e)?"Wear":"🪙 "+c}</button>`).join("")}<button class="t" onclick="hat('',0)"><span>🚫</span>No hat</button></div></div><div class="card"><h3>🎨 Bolt’s colour</h3><div class="g">${HUES.map(([h,n,c])=>`<button class="t ${S.hue==h?"on":""}" onclick="hue(${h},${c})"><span style="filter:hue-rotate(${h}deg)">🤖</span>${n}<br>${S.hues.includes(h)?(S.hue==h?"Wearing":"Use"):"🪙 "+c}</button>`).join("")}</div></div>`,"Welcome to the Workshop! You have "+S.coins+" coins. Make Bolt look awesome!")}
function hat(e,c){if(e&&!S.hats.includes(e)){if(S.coins<c){snd("bad");say("You need "+c+" coins. Play more missions to win coins!");return}S.coins-=c;S.hats.push(e)}S.hat=e;save();snd("ok");shop()}
function hue(h,c){if(!S.hues.includes(h)){if(S.coins<c){snd("bad");say("You need "+c+" coins. Play more missions!");return}S.coins-=c;S.hues.push(h)}S.hue=h;save();snd("ok");shop()}
const GAMES=[g0,g1,g2,g3,g4,g5,g6,g7];
/* 1 code racer */
const DX=[0,1,0,-1],DY=[-1,0,1,0],AR=["⬆️","➡️","⬇️","⬅️"],LV=[{t:[3,0],c:[[1,0],[2,0]],par:1},{t:[3,2],c:[[3,1],[2,0]],par:3},{t:[4,4],c:[[4,2],[1,0]],par:3}];let CG={};
function g0(){CG={lv:0,prog:[],bot:null,run:0,got:0,col:{}};d0()}
function d0(msg){const L=LV[CG.lv],t=L.t,b=CG.bot||{x:0,y:0,d:1};let cells="";for(let y=0;y<5;y++)for(let x=0;x<5;x++){const co=L.c.some(c=>c[0]==x&&c[1]==y)&&!CG.col[x+","+y];cells+=`<div class="cell">${x==b.x&&y==b.y?"🤖":x==t[0]&&y==t[1]?"🔋":co?"🪙":""}</div>`}
const py=CG.prog.map(p=>p[0]=="F"?(p[1]>1?`for i in range(${p[1]}):\n    forward()`:"forward()"):p[0]=="R"?"turn_right()":"turn_left()").join("\n");
$("#g").innerHTML=`<div class="card"><b>Level ${CG.lv+1} of 3:</b> reach the 🔋 and grab the 🪙 on the way!<div class="grid5">${cells}</div><p class="mut" style="text-align:center">Bolt faces ${AR[b.d]} ${msg||""} · Fewer than ${L.par+1} blocks = bonus!</p><div>${[1,2,3,4].map(n=>`<button class="alt" onclick="a0('F',${n})">⬆️×${n}</button>`).join("")}<button class="alt" onclick="a0('L')">↩️ Left</button><button class="alt" onclick="a0('R')">↪️ Right</button></div><b>My program:</b><pre>${E(py)||"(empty: tap blocks above)"}</pre><button class="pri" onclick="r0()">▶️ Run</button><button class="alt" onclick="CG.prog=[];CG.bot=null;d0()">🗑️ Clear</button><small style="display:block;margin-top:6px">That Python-style code is what real programmers write!</small></div>`}
function a0(t,n){if(CG.run)return;snd("tap");CG.prog.push([t,n]);CG.bot=null;d0()}
function r0(){if(CG.run)return;const L=LV[CG.lv],t=L.t,b={x:0,y:0,d:1},st=[];CG.prog.forEach(p=>{if(p[0]=="F")for(let i=0;i<p[1];i++)st.push("F");else st.push(p[0])});CG.run=1;CG.bot=b;CG.got=0;CG.col={};let i=0;
const end=()=>{CG.run=0;if(b.x==t[0]&&b.y==t[1]){snd("ok");const par=CG.prog.length<=L.par;addCoins(CG.got*2+(par?5:0));if(par)say("Perfect! Fewest blocks!");CG.lv++;CG.prog=[];CG.bot=null;CG.got=0;CG.col={};if(CG.lv>=3)return win();say("Battery charged! Next level!");d0()}else{bad();CG.bot=null;CG.col={};CG.got=0;say("Not at the battery yet. Change your program and try again!");d0("· Not there yet!")}};
const tick=()=>{if(i>=st.length)return end();const s=st[i++];if(s=="F"){b.x+=DX[b.d];b.y+=DY[b.d]}else if(s=="R")b.d=(b.d+1)%4;else b.d=(b.d+3)%4;snd("tap");if(b.x<0||b.y<0||b.x>4||b.y>4){CG.run=0;CG.bot=null;CG.col={};CG.got=0;bad();say("Oops! Bolt’s arm left the grid. Try again!");return d0("· Oops, off the grid!")}const k=b.x+","+b.y;if(L.c.some(c=>c[0]==b.x&&c[1]==b.y)&&!CG.col[k]){CG.col[k]=1;CG.got++;pop("🪙")}d0();setTimeout(tick,250)};tick()}
/* 2 cookie catcher: you make the data */
const NM=["Mia","Ravi","Zoe","Arun","Kai"];
function g1(){CK={n:[0,0,0,0,0],lane:2,it:[],left:200,t:null,c:0,tk:0};d1()}
function d1(){$("#g").innerHTML=`<div class="card"><b>🍪 Catch cookies for 20 seconds!</b><p class="mut">Tap a name to slide the basket under the falling cookies. Your catches become the data!</p><div id="ar" style="position:relative;height:240px;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(#cfe8ff,#fff)"></div><div style="display:flex;gap:4px">${NM.map((n,i)=>`<button class="alt" style="flex:1;margin:4px 0;padding:8px 2px" onclick="mv1(${i})">${n}</button>`).join("")}</div><p id="ck1" class="mut">Press start when ready!</p><button class="pri" id="go1" onclick="st1()">▶️ Start</button></div>`;dr1()}
function dr1(){const a=$("#ar");if(!a)return;a.innerHTML=CK.it.map(c=>`<div style="position:absolute;left:${c.l*20+4}%;top:${c.y}px;font-size:1.7rem">🍪</div>`).join("")+`<div style="position:absolute;left:${CK.lane*20+3}%;top:196px;font-size:2.2rem">🧺</div>`;const p=$("#ck1");if(p&&CK.t)p.textContent="⏱️ "+Math.ceil(CK.left/10)+"s · 🍪 "+sum(CK.n)+(CK.c>2?" · 🔥 combo x"+CK.c:"")}
function mv1(i){CK.lane=i;snd("tap");dr1()}
function st1(){if(CK.t)return;$("#go1").disabled=true;CK.t=setInterval(tk1,100)}
function tk1(){CK.left--;CK.tk++;if(CK.tk%6==0)CK.it.push({l:ri(0,4),y:0});CK.it.forEach(c=>c.y+=14);CK.it=CK.it.filter(c=>{if(c.y>=190){if(c.l==CK.lane){CK.n[c.l]++;CK.c++;snd("tap")}else CK.c=0;return false}return true});dr1();if(CK.left<=0)e1()}
function e1(){clearInterval(CK.t);CK.t=null;const T=sum(CK.n);if(T<6){$("#g").innerHTML=`<div class="card"><h3>Only ${T} cookies! 🍪</h3><p>Catch at least 6 so we have data to study. Try again!</p><button class="pri" onclick="g1()">🔁 Play again</button></div>`;return}addCoins(Math.min(T,15));const mx=Math.max(...CK.n);CK.R=0;CK.mx=NM.filter((n,i)=>CK.n[i]==mx);CK.T=T;q1()}
function q1(){if(CK.R>=3)return win();const T=CK.T,Q=[["Which kid caught the MOST cookies?",CK.mx[0],NM],["How many cookies did you catch in total?",T,null],["If every kid caught the same number, about how many each? (total ÷ 5)",Math.round(T/5),null]][CK.R];let o;if(Q[2])o=NM;else{o=[Q[1]];while(o.length<3){const v=Math.max(0,Q[1]+ri(-3,3));if(!o.includes(v))o.push(v)}o=shuf(o)}CK.ok=CK.R==0?CK.mx.map(String):[String(Q[1])];
$("#g").innerHTML=`<div class="card"><b>Your cookie data 📊</b><div class="chart">${CK.n.map((x,i)=>`<div style="height:${Math.max(6,x/Math.max(...CK.n)*100)}%">${x}<small>${NM[i]}</small></div>`).join("")}</div><p><b>${Q[0]}</b></p>${o.map(x=>`<button class="opt" onclick="p1(this,'${x}')">${x}</button>`).join("")}</div>`}
function p1(b,x){if(CK.ok.includes(x)){b.classList.add("ok");snd("ok");say("Yes! You are a data detective!");CK.R++;setTimeout(q1,700)}else{b.classList.add("no");b.disabled=true;bad();say("Not quite. Look at your chart again!")}}
/* 3 sorting factory: teach Bolt, then watch him work (real logistic regression) */
function lr(X,y,ep,l){let w=[0,0,0],n=X.length;for(let e=0;e<ep;e++){let g=[0,0,0];X.forEach((x,i)=>{const d=1/(1+Math.exp(-(w[0]+w[1]*x[0]+w[2]*x[1])))-y[i];g[0]+=d;g[1]+=d*x[0];g[2]+=d*x[1]});for(let k=0;k<3;k++)w[k]-=l*g[k]/n}return w}
const pr=(w,x)=>1/(1+Math.exp(-(w[0]+w[1]*x[0]+w[2]*x[1])));
const rf=(a,b)=>a+Math.random()*(b-a),mkI=t=>t==1?{e:"🍌",x:[rf(6,9.5)/10,rf(6.5,9.5)/10],t:1}:Math.random()<.5?{e:"🍎",x:[rf(.5,3.5)/10,rf(2.5,4.5)/10],t:0}:{e:"🍏",x:[rf(2.5,4.5)/10,rf(2.5,4.5)/10],t:0},batch=()=>shuf([...Array.from({length:6},()=>mkI(1)),...Array.from({length:6},()=>mkI(0))]);let FC={};
function g2(){FC={q:batch(),i:0,tr:[]};d2()}
function d2(){const it=FC.q[FC.i];$("#g").innerHTML=`<div class="card"><b>🏭 Step 1: sort fruit ${FC.i+1} of 12.</b><br>Bolt watches how YOU sort, then he works alone!<div class="big" style="font-size:6rem">${it.e}</div><button class="opt" onclick="s2(0)">🍎 Apple</button><button class="opt" onclick="s2(1)">🍌 Banana</button><div class="bar"><i style="width:${FC.i/12*100}%"></i></div></div>`}
function s2(l){const it=FC.q[FC.i];FC.tr.push([it.x,l]);if(l!=it.t){bad();say("Oops, that was a "+(it.t?"banana":"apple")+"! Bolt copies your sorting, so be careful!")}else snd("tap");FC.i++;if(FC.i>=12)return t2();d2()}
function t2(){const a=FC.tr.filter(x=>!x[1]).length;if(a<2||12-a<2){$("#g").innerHTML=`<div class="card">Bolt needs to see both fruits. Try again!</div><button class="go" onclick="g2()">🔁 Again</button>`;return}FC.w=lr(FC.tr.map(x=>x[0]),FC.tr.map(x=>x[1]),1500,8);$("#g").innerHTML=`<div class="card"><b>🧠 Bolt learned from your 12 sorts!</b><p>Now watch Bolt sort 12 NEW fruits all by himself. Can he get 10 right?</p><button class="go" onclick="r2()">▶️ Run the factory</button></div>`;say("Now watch me sort by myself!")}
function r2(){FC.q=batch();FC.i=0;FC.ok=0;FC.log=[];CK.t=setInterval(()=>{const it=FC.q[FC.i],g=pr(FC.w,it.x)>.5?1:0,ok=g==it.t;if(ok)FC.ok++;FC.log.push((ok?"✅ ":"❌ ")+it.e+" → Bolt says "+(g?"🍌":"🍎"));snd(ok?"tap":"bad");FC.i++;$("#g").innerHTML=`<div class="card"><b>🤖 Bolt is sorting… ${FC.i}/12</b><p>${FC.log.join("<br>")}</p></div>`;if(FC.i>=12){clearInterval(CK.t);CK.t=null;e2()}},350)}
function e2(){const ok=FC.ok;if(ok>=10){say("Bolt got "+ok+" of 12 right!");$("#g").insertAdjacentHTML("beforeend",`<button class="go" onclick="win()">🎉 Bolt’s eyes work!</button>`)}else{bad();say("Bolt got "+ok+" of 12. Maybe some of your sorts were wrong. Try again!");$("#g").insertAdjacentHTML("beforeend",`<button class="go" onclick="g2()">🔁 Teach again</button>`)}}
/* 4 mood machine: real naive Bayes from her labels */
const HP=["I love my puppy","This cake is yummy","We won the game","Best day ever","I feel so happy","The party was fun","I love my friends","What a great surprise"],SP=["I lost my toy","This rain is gloomy","I feel so sad","My ice cream fell","I hate being sick","It was a bad day","I miss my friend","I am very lonely"];
let MM={};const tok=s=>s.toLowerCase().split(/[^a-z']+/).filter(Boolean);
function g3(){let n=0;do{const h=shuf(HP),s=shuf(SP);MM={tr:shuf([...h.slice(0,4).map(x=>[x,1]),...s.slice(0,4).map(x=>[x,0])]),te:shuf([...h.slice(4,6).map(x=>[x,1]),...s.slice(4,6).map(x=>[x,0])]),lab:{}};n++}while(n<300&&MM.te.some(x=>nb(MM.tr,x[0])!=x[1]));d3()}
function d3(){const all=Object.keys(MM.lab).length==8;$("#g").innerHTML=`<div class="card"><p><b>Step 1:</b> teach Bolt. Tap 😊 or 😢 for each sentence.</p>${MM.tr.map((x,i)=>`<div style="margin:6px 0">${E(x[0])}<br><button class="alt ${MM.lab[i]===1?"on":""}" onclick="l3(${i},1)">😊</button><button class="alt ${MM.lab[i]===0?"on":""}" onclick="l3(${i},0)">😢</button></div>`).join("")}<button class="pri" ${all?"":"disabled style='opacity:.5'"} onclick="t3()">🔍 Test Bolt (step 2)</button><div id="m3"></div></div>`}
function l3(i,c){MM.lab[i]=c;snd("tap");d3()}
function nb(tr,t){const cnt=[{},{}],tot=[0,0],n=[0,0],Vv=new Set();tr.forEach(x=>{n[x[1]]++;tok(x[0]).forEach(w=>{cnt[x[1]][w]=(cnt[x[1]][w]||0)+1;tot[x[1]]++;Vv.add(w)})});const ws=tok(t),lp=[0,1].map(c=>Math.log((n[c]+1)/(tr.length+2))+ws.reduce((s,w)=>s+Math.log(((cnt[c][w]||0)+1)/(tot[c]+Vv.size)),0));return lp[1]>lp[0]?1:0}
function t3(){const tr=MM.tr.map((x,i)=>[x[0],MM.lab[i]]),r=MM.te.map(x=>[x[0],x[1],nb(tr,x[0])]),ok=r.filter(x=>x[1]==x[2]).length;$("#m3").innerHTML=`<h3>Bolt’s guesses: ${ok} of 4 right</h3>${r.map(x=>`<p>${x[1]==x[2]?"✅":"❌"} ${E(x[0])} → Bolt says ${x[2]?"😊":"😢"}</p>`).join("")}`;if(ok>=3){snd("ok");say("Bolt understood "+ok+" of 4 feelings!");setTimeout(win,1400)}else{bad();say("Bolt got "+ok+" of 4. Check your labels and try again!");setTimeout(()=>{g3()},2600)}}
/* 5 genie art: be specific or the genie guesses */
const GA=[["Animal",[["🐶","a dog"],["🐱","a cat"],["🐉","a dragon"],["🦄","a unicorn"]]],["Wearing",[["🎩","a top hat"],["👑","a crown"],["🕶️","sunglasses"],["🎀","a bow"]]],["Place",[["🏖️","at the beach"],["🏔️","on a mountain"],["🌌","in space"],["🌳","in the forest"]]],["Doing",[["🍕","eating pizza"],["⚽","playing football"],["🎸","playing guitar"],["📚","reading a book"]]]];let GG={};
const sc4=a=>`<div style="font-size:3rem;text-align:center;line-height:1.2">${GA[2][1][a[2]][0]}<br>${GA[1][1][a[1]][0]}${GA[0][1][a[0]][0]}<br>${GA[3][1][a[3]][0]}</div>`;
function g4(){GG={r:0};n4()}
function n4(){if(GG.r>=3)return win();GG.t=GA.map(()=>ri(0,3));GG.s=[-1,-1,-1,-1];d4()}
function d4(msg){const txt=GA.map((a,i)=>GG.s[i]<0?"something":a[1][GG.s[i]][1]);$("#g").innerHTML=`<div class="card"><b>Round ${GG.r+1} of 3 🧞 Make the genie draw THIS picture:</b>${sc4(GG.t)}<p class="mut">Tell the genie every detail. If you leave something out, the genie GUESSES!</p>${GA.map((a,i)=>`<b>${a[0]}</b><div>${a[1].map((o,k)=>`<button class="alt ${GG.s[i]==k?"on":""}" onclick="GG.s[${i}]=${k};snd('tap');d4()">${o[0]} ${o[1].replace(/^(a|an) /,"")}</button>`).join("")}</div>`).join("")}<pre>Draw ${txt[0]} wearing ${txt[1]} ${txt[2]} ${txt[3]}.</pre><button class="pri" onclick="m4()">🧞 Make it!</button><div id="w4">${msg||""}</div></div>`}
function m4(){const res=GG.s.map((v,i)=>v<0?ri(0,3):v),ok=res.every((v,i)=>v==GG.t[i]),guessed=GG.s.filter(v=>v<0).length,wrong=GG.s.filter((v,i)=>v>=0&&v!=GG.t[i]).length;if(ok){snd("ok");addCoins(5);GG.r++;say(guessed?"Lucky guess! But next time say every detail.":"Perfect! A clear wish gets a clear picture. AI prompts work the same way!");$("#g").innerHTML=`<div class="card" style="text-align:center"><b>🧞 The genie draws…</b>${sc4(res)}<p>✅ It matches!</p><button class="go" onclick="n4()">Next ➜</button></div>`}else{bad();say(guessed?"The genie had to guess "+guessed+" thing"+(guessed>1?"s":"")+" you did not say. Be specific!":"That is not the picture. Check each detail!");d4(`<p>🧞 The genie drew:</p>${sc4(res)}<p>${guessed?"🤔 The genie guessed "+guessed+" detail"+(guessed>1?"s":"")+" because you left them out. ":""}${wrong?"❌ "+wrong+" detail"+(wrong>1?"s":"")+" you picked don’t match the target.":""}</p>`)}}
/* 6 fair play referee */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gs=r=>Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r());
function faSim(b,u){const r=rng(7),mk=(n,g,m,r)=>Array.from({length:n},()=>{const x=m+.1*gs(r);return [x*6,g,x>m?1:0]}),nB=Math.max(2,Math.round(100*b/(100-b))),T=mk(100,0,.35,r).concat(mk(nB,1,.65,r)),w=lr(T.map(x=>[x[0],u?x[1]:0]),T.map(x=>x[2]),3000,.6),r2=rng(99),acc=(g,m)=>{const d=mk(200,g,m,r2);return d.filter(x=>(pr(w,[x[0],u?x[1]:0])>.5?1:0)==x[2]).length/200*100};return [acc(0,.35),acc(1,.65),nB]}
let FL=0,FH=0;
function g5(){FL=0;FH=0;$("#g").innerHTML=`<div class="card"><p>Team B has few examples. <b>Step 1:</b> find the gap. <b>Step 2:</b> fix it so both teams reach 85%.</p><input type="range" id="fs" min="5" max="50" step="5" value="5" oninput="f5()" aria-label="Team B share of training data"><p>Team B share of examples: <b id="fv">5%</b></p><label><input type="checkbox" id="fg" style="width:auto" onchange="f5()"> Tell the robot which team each player is on</label><div id="fr"></div></div>`;f5()}
function f5(){const b=+$("#fs").value,u=$("#fg").checked,[a,c]=faSim(b,u),gap=Math.abs(a-c)>15;$("#fv").textContent=b+"%";$("#fr").innerHTML=`<b>Team A: ${Math.round(a)}%</b><div class="bar"><i style="width:${a}%"></i></div><b>Team B: ${Math.round(c)}%</b><div class="bar"><i style="width:${c}%"></i></div><p>${gap?"⚠️ Unfair! One team does much worse.":a>=85&&c>=85?"✅ Fair! Both teams do well.":"⚠️ The robot struggles for both teams."}</p>`;if(gap&&!FL){FL=1;say("You found the gap! Now fix it so both teams are at 85% or more.")}if(FL&&a>=85&&c>=85&&!FH){FH=1;snd("ok");setTimeout(win,1200)}}
/* 7 chat with bolt */
let BC={};
function g6(){BC={ok:0,ns:0};$("#g").innerHTML=`<div class="card"><p>Bolt knows 3 things. Change them if you like! Then chat.</p>${[["hello bolt","Hi friend! Ready to play?"],["what is your name","I am Bolt, the repair-bot!"],["tell me a joke","Why did the robot go to school? To improve its byte size!"]].map((x,i)=>`<input id="bp${i}" value="${E(x[0])}" aria-label="Phrase ${i+1}"><input id="br${i}" value="${E(x[1])}" aria-label="Reply ${i+1}">`).join("")}<p><b>Chat:</b> match 2 times, then ask something silly to see ‘not sure’.</p><input id="bm" placeholder="Say something to Bolt…" onkeydown="if(event.key=='Enter')c6()"><button class="pri" onclick="c6()">Send</button><pre id="bo">Bolt is waiting.</pre></div>`}
function c6(){const m=$("#bm").value.trim();if(!m)return;const t=new Set(tok(m));let best=0,rep=null;[0,1,2].forEach(i=>{const pt=tok($("#bp"+i).value);if(!pt.length)return;const s=pt.filter(w=>t.has(w)).length/pt.length;if(s>best){best=s;rep=$("#br"+i).value}});$("#bm").value="";if(best>=.5){$("#bo").textContent="You: "+m+"\nBolt: "+rep+"  ("+Math.round(best*100)+"% match)";snd("ok");BC.ok++;say(rep)}else{$("#bo").textContent="You: "+m+"\nBolt: I’m not sure about that yet. Teach me! ("+Math.round(best*100)+"% match)";snd("tap");BC.ns++;say("I’m not sure about that yet. Teach me!")}if(BC.ok>=2&&BC.ns>=1)setTimeout(win,1500)}

function b7(){const P=["Help grandma remember her medicine","Find lost pets","Sort recycling","Help kids learn maths"],W=["⏰ Reminder power","🔎 Finder power","♻️ Sorter power","🧮 Teacher power"];if(PC.p<0||PC.w<0||!PC.c.every(Boolean)){bad();say("Pick a problem, a power and tick all 3 safety checks!");return}S.cap={p:P[PC.p],w:W[PC.w]};save();$("#p7").innerHTML=`<pre>⚡ ${E(S.name)}’s Power Core\nProblem: ${P[PC.p]}\nBolt’s power: ${W[PC.w]}\nSafety: checked ✅</pre>`;snd("ok");setTimeout(win,1500)}
