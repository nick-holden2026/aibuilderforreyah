{e:"🐍",t:"Python Power",c:"#16b97d",k:[["🐍","Variables are labelled boxes. age = 10 puts 10 in a box called age. print(age) shows what is inside the box."],["🔀","if lets code decide, and a for loop repeats things. Python uses spaces at the start of a line, called indentation, to know what belongs inside."]],lab:"py",q:["What does a variable do?",["Stores a value with a name","Draws a picture","Turns off the computer"],"A variable is a named box for a value."]},

{e:"⚖️",t:"Fair or Not?",c:"#e8903a",k:[["⚖️","AI can be unfair if its training data leaves some groups out. It may work well for one group and badly for another."],["🌍","Good builders test each group separately, add examples from groups that are missing, and give the model the information it needs."]],lab:"fa",q:["How can you make a model fairer?",["Add examples from every group","Use fewer examples","Hide the results"],"Balanced, varied data helps all groups."]},

{e:"🏆",t:"Capstone Studio",c:"#d6277a",k:[["🏆","A capstone is a project that uses what you learned to solve a real problem for real people."],["🛡️","Before you share it, check safety: protect privacy, test with others, and explain what it cannot do."]],lab:"cp",q:["Before sharing a project you should...",["Test it and check safety","Skip testing","Hide how it works"],"Testing and safety checks come first."]}];
let AC;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
function snd(t){if(S.mute||!AC)return;try{AC.resume();({ok:[523,659,784],bad:[250,190],up:[523,659,784,1047,1319],tap:[620]}[t]||[500]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t=="bad"?"sawtooth":"triangle";o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+i*.11;o.start(s);g.gain.exponentialRampToValueAtTime(.001,s+.2);o.stop(s+.22)})}catch(e){}}
let LAST="";function say(t){LAST=t;const b=$("#bub");if(b)b.textContent=t;if(S.mute||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=S.pet=="cat"?1.8:.6;u.lang="en-US";speechSynthesis.speak(u)}catch(e){}}
function confetti(){["🎉","⭐","✨","🎈"].forEach(c=>{for(let i=0;i<4;i++){const d=document.createElement("div");d.className="cf";d.textContent=c;d.style.left=Math.random()*95+"vw";d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}})}

const nd=()=>MS.filter((_,i)=>S.w[i]).length;
let V="map",C=null,G=0;

function start(i){C={i,j:0};step()}
function step(){const m=MS[C.i],n=m.k.length+2;if(C.j>=n)return fin();G=0;const dots=`<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k<C.j?"d":k==C.j?"c":""}"></i>`).join("")}</div>`;let h=dots+buddy(),t;
if(C.j<m.k.length){const c=m.k[C.j];t=c[1];h+=`<div class="big">${c[0]}</div><button class="go" onclick="C.j++;step()">Next ➜</button>`}
else if(C.j==m.k.length){t="Your turn! "+({py:"Write the Python code to complete all 3 tasks.",da:"Use the buttons to ask the data questions.",ml:"Add red and blue points, then train your model!",nb:"Teach it 2 sentences of your own, then test 2 sentences.",pp:"Fill in the four parts and get 75% or more.",fa:"First find a gap between the groups, then fix it so both groups score 85% or more.",bt:"Teach 2 intents, then ask your bot something.",cp:"Plan your project and save it!"})[m.lab];h+=`<div id="lab">${LAB[m.lab]()}</div><div id="nx"></div>`}
else{t=m.q[0];C.o=m.q[1].map((x,k)=>[x,k]);const r=(C.i+1)%3;C.o=C.o.slice(r).concat(C.o.slice(0,r));h+=C.o.map((o,k)=>`<button class="opt" id="o${k}" onclick="pick(${k})">${E(o[0])}</button>`).join("")+`<div id="nx"></div>`}
show(h,t);if(C.j==m.k.length&&AFTER[m.lab])AFTER[m.lab]()}
function goal(){if(G)return;G=1;snd("ok");say("Brilliant, "+S.name+"! You did it!");$("#nx").innerHTML=`<button class="go" onclick="C.j++;step()">Next ➜</button>`}

da:()=>{const mx=Math.max(...DD.map(x=>x[1]));return `<p>How many pets does each student have?</p><svg viewBox="0 0 300 150" style="width:100%" role="img" aria-label="Bar chart of pets per student">${DD.map((x,i)=>`<rect x="${i*50+8}" y="${130-x[1]/mx*110}" width="34" height="${x[1]/mx*110}" rx="6" fill="var(--p)"/><text x="${i*50+25}" y="145" text-anchor="middle" font-size="11" fill="currentColor">${x[0]}</text><text x="${i*50+25}" y="${124-x[1]/mx*110}" text-anchor="middle" font-size="12" fill="currentColor">${x[1]}</text>`).join("")}</svg><button class="alt" onclick="daQ('t')">➕ Total</button><button class="alt" onclick="daQ('a')">⚖️ Average</button><button class="alt" onclick="daQ('b')">🏔️ Biggest</button><pre id="dr">Tap a button to ask the data a question.</pre>`},
ml:()=>`<p>Pick a colour, then tap the box to add points.</p><button class="alt" onclick="MC=0">🔴 Red</button><button class="alt" onclick="MC=1">🔵 Blue</button><button class="alt" onclick="mlDemo()">✨ Add examples</button><button class="alt" onclick="MP=[];MW=null;$('#mr').textContent='';drawML()">Clear</button><svg id="sv" viewBox="0 0 300 240" style="width:100%;background:var(--card);border:3px solid var(--line);border-radius:18px;touch-action:manipulation;cursor:crosshair" onclick="mlAdd(event)"></svg><button class="pri" onclick="mlTrain()">🧠 Train my model</button><p id="mr"></p>`,
nb:()=>`<p>Teach it happy and sad sentences, then test it.</p><input id="ns" placeholder="Type a sentence…" maxlength="60"><button class="alt" onclick="nbAdd(1)">😊 Happy</button><button class="alt" onclick="nbAdd(0)">😢 Sad</button><pre id="nl"></pre><input id="nt" placeholder="Test a new sentence…" maxlength="60" onkeydown="if(event.key=='Enter')nbTest()"><button class="pri" onclick="nbTest()">🔍 Test it</button><pre id="nr">Result appears here.</pre>`,
pp:()=>`<p>Build a prompt to explain volcanoes to a 7-year-old.</p>${["Role","Task","Format","Limits"].map((x,i)=>`<label><b>${x}</b></label><input id="p${i}" placeholder="${["You are a friendly science teacher","Explain how volcanoes erupt","Use 3 short bullet points","Use simple words and no scary details"][i]}" oninput="ppScore()">`).join("")}<p><b>Your prompt:</b></p><pre id="pv"></pre><div class="bar"><i id="pb" style="width:0"></i></div><p id="ps2"></p><small>Weak prompt for comparison: "Explain volcanoes" scores 0%.</small>`,
fa:()=>`<p>A model learns from <b>Group A</b> (100 examples) and <b>Group B</b>. It does not know which group someone is in. What share of the training data is Group B?</p><input type="range" id="fs" min="5" max="50" step="5" value="5" oninput="faRun()" aria-label="Group B share of training data"><p>Group B share: <b id="fv">5%</b></p><label><input type="checkbox" id="fg" style="width:auto" onchange="faRun()"> Let the model see which group each example is from</label><div id="fr"></div>`,
bt:()=>`<p>Teach your bot. Put several phrases separated by commas, then a reply.</p><input id="bp" placeholder="hello, hi there, hey"><input id="br" placeholder="Hi! How can I help?"><button class="alt" onclick="btAdd()">➕ Teach</button><div id="bl"></div><input id="bm" placeholder="Say something to your bot…" onkeydown="if(event.key=='Enter')btAsk()"><button class="pri" onclick="btAsk()">Send</button><pre id="bo">Your bot is waiting.</pre>`,

let e;if(/\bPrint\b/.test(c))e="Python is case-sensitive. Use lowercase print.";else if((c.match(/["']/g)||[]).length%2)e="A quote mark is missing at one end of the text.";else if(/\b(if|for)\b/.test(c)&&!/:/.test(c))e="if and for lines must end with a colon.";else if(/\b(if|for)\b/.test(c)&&!/\n[ \t]+\S/.test(c))e="The line inside if or for must be indented with spaces.";else if(/print\s*[^(\s]/.test(c))e="print needs brackets: print(...).";else e="Not quite. Re-read the task and check every part.";o.textContent="Error: "+e;snd("bad")}

/* real logistic regression */
function lr(X,y,ep,l){let w=[0,0,0],n=X.length;for(let e=0;e<ep;e++){let g=[0,0,0];X.forEach((x,i)=>{const d=1/(1+Math.exp(-(w[0]+w[1]*x[0]+w[2]*x[1])))-y[i];g[0]+=d;g[1]+=d*x[0];g[2]+=d*x[1]});for(let k=0;k<3;k++)w[k]-=l*g[k]/n}return w}
const pr=(w,x)=>1/(1+Math.exp(-(w[0]+w[1]*x[0]+w[2]*x[1])));

function mlAdd(e){const r=$("#sv").getBoundingClientRect();MP.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,MC]);MW=null;snd("tap");drawML()}
function mlDemo(){for(let i=0;i<7;i++){MP.push([.15+Math.random()*.3,.15+Math.random()*.3,0]);MP.push([.55+Math.random()*.3,.55+Math.random()*.3,1])}MW=null;drawML()}
function drawML(){const s=$("#sv");if(!s)return;let h=MP.map(p=>`<circle cx="${p[0]*300}" cy="${p[1]*240}" r="7" fill="${p[2]?"#2f7bff":"#ff4d6d"}"/>`).join("");if(MW&&Math.abs(MW[2])>1e-6){const y=x=>-(MW[0]+MW[1]*x)/MW[2];h+=`<line x1="0" y1="${y(0)*240}" x2="300" y2="${y(1)*240}" stroke="#12a97a" stroke-width="4" stroke-linecap="round"/>`}s.innerHTML=h}
function mlTrain(){const a=MP.filter(p=>!p[2]).length,b=MP.length-a;if(a<2||b<2){$("#mr").textContent="Add at least 2 red and 2 blue points first.";return}MW=lr(MP.map(p=>[p[0],p[1]]),MP.map(p=>p[2]),1500,8);const ok=MP.filter(p=>(pr(MW,p)>.5?1:0)==p[2]).length,acc=Math.round(ok/MP.length*100);drawML();$("#mr").textContent="The green line splits the colours. Accuracy: "+acc+"% ("+ok+" of "+MP.length+" points correct)."+(acc<85?" Try adding more points or clearer groups.":"");snd(acc>=85?"ok":"tap");if(acc>=85&&MP.length>=8&&a>=3&&b>=3)goal()}
/* naive bayes */
let NB=[["I love this game",1],["what a great day",1],["this is so fun",1],["I hate this",0],["what a bad day",0],["this is so boring",0]],NA=0,NT=0;
const tok=s=>s.toLowerCase().split(/[^a-z']+/).filter(Boolean);
function nbDraw(){const l=$("#nl");if(l)l.textContent=NB.map(x=>(x[1]?"😊 ":"😢 ")+x[0]).join("\n")}
function nbAdd(c){const i=$("#ns"),t=i.value.trim();if(tok(t).length<2)return;NB.push([t,c]);NA++;i.value="";snd("tap");nbDraw()}
function nbPred(t){const cnt=[{},{}],tot=[0,0],n=[0,0],V=new Set();NB.forEach(x=>{n[x[1]]++;tok(x[0]).forEach(w=>{cnt[x[1]][w]=(cnt[x[1]][w]||0)+1;tot[x[1]]++;V.add(w)})});const ws=tok(t),lp=[0,1].map(c=>Math.log(n[c]/NB.length)+ws.reduce((s,w)=>s+Math.log(((cnt[c][w]||0)+1)/(tot[c]+V.size)),0)),p1=1/(1+Math.exp(lp[0]-lp[1])),key=ws.map(w=>[w,Math.log(((cnt[1][w]||0)+1)/(tot[1]+V.size))-Math.log(((cnt[0][w]||0)+1)/(tot[0]+V.size))]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3);return [p1,key]}
function nbTest(){const t=$("#nt").value.trim();if(tok(t).length<1)return;const [p,k]=nbPred(t),h=p>.5;$("#nr").textContent=(h?"😊 Happy":"😢 Sad")+" ("+Math.round((h?p:1-p)*100)+"% sure)\nWords that mattered: "+k.map(x=>x[0]+(x[1]>0?" (happy clue)":" (sad clue)")).join(", ");NT++;snd("ok");if(NA>=2&&NT>=2)goal()}
/* prompt */
function ppScore(){const v=[0,1,2,3].map(i=>($("#p"+i).value||"").trim()),ch=[v[0].split(/\s+/).length>=3&&/(you are|act as|teacher|expert|friendly)/i.test(v[0]),v[1].split(/\s+/).length>=3&&/volcano/i.test(v[1]),/(bullet|list|steps|sentence|table|short|paragraph)/i.test(v[2]),/(no |only|under|max|avoid|simple|words|not )/i.test(v[3])],sc=ch.filter(Boolean).length*25;$("#pv").textContent=v.filter(Boolean).join(" ")||"Your prompt will appear here.";$("#pb").style.width=sc+"%";$("#ps2").textContent="Score: "+sc+"%  "+ch.map((x,i)=>(x?"✅ ":"❌ ")+["Role","Task (mention volcanoes)","Format","Limits"][i]).join("  ");if(sc>=75)goal()}
/* fairness: real training on synthetic data */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gs=r=>Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r());
function faSim(b,u){const r=rng(7),mk=(n,g,m,r)=>Array.from({length:n},()=>{const x=m+.1*gs(r);return [x*6,g,x>m?1:0]}),nB=Math.max(2,Math.round(100*b/(100-b))),T=mk(100,0,.35,r).concat(mk(nB,1,.65,r)),w=lr(T.map(x=>[x[0],u?x[1]:0]),T.map(x=>x[2]),3000,.6),r2=rng(99),acc=(g,m)=>{const d=mk(200,g,m,r2);return d.filter(x=>(pr(w,[x[0],u?x[1]:0])>.5?1:0)==x[2]).length/200*100};return [acc(0,.35),acc(1,.65),nB]}
let FL=0,FH=0;
function faRun(){const b=+$("#fs").value,u=$("#fg").checked,[a,c,n]=faSim(b,u),gap=Math.abs(a-c)>15;$("#fv").textContent=b+"%";$("#fr").innerHTML=`<p class="mut">Training data: 100 from Group A and ${n} from Group B.</p><b>Group A accuracy: ${Math.round(a)}%</b><div class="bar"><i style="width:${a}%"></i></div><b>Group B accuracy: ${Math.round(c)}%</b><div class="bar"><i style="width:${c}%"></i></div>${gap?"<p>⚠️ The model works much worse for one group. It saw too few examples of them.</p>":a>=85&&c>=85?"<p>✅ Both groups do well. Fair data and the right information fixed it!</p>":"<p>⚠️ The model struggles for both groups. Try giving it more information.</p>"}`;if(gap)FL=1;if(a>=85&&c>=85)FH=1;if(FL&&FH)goal()}
/* bot */
let BI=[],BA=0;
function btDraw(){const l=$("#bl");if(l)l.innerHTML=BI.map(x=>`<small>🗣️ ${E(x[0].join(", "))} ➜ ${E(x[1])}</small><br>`).join("")}
function btAdd(){const p=$("#bp").value.split(",").map(x=>x.trim()).filter(Boolean),r=$("#br").value.trim();if(!p.length||!r)return;BI.push([p,r]);$("#bp").value="";$("#br").value="";snd("tap");btDraw()}
function btAsk(){const m=$("#bm").value.trim();if(!m)return;const t=new Set(tok(m));let best=0,rep=null;BI.forEach(x=>x[0].forEach(p=>{const pt=tok(p);if(!pt.length)return;const s=pt.filter(w=>t.has(w)).length/pt.length;if(s>best){best=s;rep=x[1]}}));$("#bm").value="";if(best>=.5){$("#bo").textContent="You: "+m+"\nBot: "+rep+"  ("+Math.round(best*100)+"% match)";snd("ok");BA=1;say(rep);if(BI.length>=2&&BA)goal()}else{$("#bo").textContent="You: "+m+"\nBot: I’m not sure. Teach me! (best match "+Math.round(best*100)+"%)";snd("bad")}}
/* capstone */
function cpSave(){const v=[0,1,2,3,4].map(i=>$("#k"+i).value.trim());if(v.some(x=>x.split(/\s+/).length<3)){$("#ce").textContent="Write at least 3 words in every box.";return}S.cap=v;save();goal()}
/* trophies */
function tro(){const T=MS.map((m,i)=>[m.e,m.t,S.w[i]]).concat([["🎓","Level 2 Expert",nd()==8]]);show(buddy()+`<div class="card" style="text-align:center"><div style="font-size:3rem">${PE()}</div><h2 style="margin:0">${E(S.name)}</h2><p>${nd()} of 8 missions complete</p><input value="${E(S.name)}" maxlength="14" aria-label="Your name" onchange="S.name=this.value||'Reyah';save();tro()"><button class="alt" onclick="S.pet=S.pet=='dog'?'cat':'dog';save();tro()">🔁 Switch buddy</button></div><div class="g">${T.map(t=>`<div class="t ${t[2]?"on":""}"><span>${t[0]}</span>${E(t[1])}</div>`).join("")}</div>`+(S.cap?`<div class="card"><h3>🏆 My capstone</h3>${["Problem","Who it helps","How AI helps","How I will test it","Safety check"].map((x,i)=>`<p><b>${x}:</b> ${E(S.cap[i])}</p>`).join("")}</div>`:"")+(nd()==8?`<div class="card" style="text-align:center;border:6px double var(--y)"><div style="font-size:4rem">🎓</div><h2 style="margin:0">AI Builder Certificate</h2><p>Awarded to</p><h1 style="margin:0">${E(S.name)}</h1><p>for training a real model, building a sentiment finder, testing fairness, creating a bot and planning a capstone.</p><button class="pri noprint" onclick="window.print()">🖨️ Print</button></div>`:`<p style="text-align:center;color:var(--mut)">Finish all 8 missions to earn your AI Builder Certificate.</p>`),nd()==8?"You did it, "+S.name+"! You are an AI Builder!":"Keep collecting trophies, "+S.name+"!")}
$("#wh").textContent="Welcome back, "+S.name+"!";hdr();
</script></body></html>
